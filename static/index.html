<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Moban Content Suggester</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>
    <div class="background-video">
        <video autoplay loop muted>
            <source src="/content/mobanbg2.mp4" type="video/mp4">
        </video>
    </div>
    <div class="content">
        <header>
            <h1>
                <span class="wave-text">Mr. Moban</span>
                <span class="text-heading">
                    <span class="words">
                        <span>Movie</span>
                        <span>WebSeries</span>
                        <span>Anime</span>
                    </span>
                </span>
                <span>Suggester</span>
            </h1>
            <p class="shimmer">Mr. Moban is here to assist you with freshening up your mood with content you like.</p>
        </header>
        <main>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for movies, anime, or web series...">
                <button id="search-button">Search</button>
                <div class="search-animation"></div>
            </div>
            <div id="results-section"></div>
        </main>
    </div>
    <script src="/js/script.js"></script>
    <script>


    </script>
</body>
</html>
